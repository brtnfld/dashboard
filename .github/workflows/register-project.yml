name: Register project

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  register:
    if: contains(github.event.issue.labels.*.name, 'registration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: python -m pip install requests pyyaml

      # Pass the untrusted issue body through an env var, never interpolated
      # directly into a run: script -- see GitHub's own hardening guidance on
      # untrusted input (github.event.issue.body could contain shell syntax).
      - name: Run registration checks
        id: process
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$ISSUE_BODY" | python ./_explore/scripts/process_registration.py > /tmp/result.json
          cat /tmp/result.json

      - name: Build checklist comment
        id: checklist
        run: |
          delim="EOF_$(date +%s%N)"
          {
            echo "comment<<$delim"
            jq -r '.checklist[] | "- \(if .passed then "✅" else "❌" end) **\(.label)** — \(.detail)"' /tmp/result.json
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Handle result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CHECKLIST: ${{ steps.checklist.outputs.comment }}
        run: |
          VALID=$(jq -r '.valid' /tmp/result.json)
          AUTO_MERGE=$(jq -r '.auto_merge' /tmp/result.json)
          REPO=$(jq -r '.repo' /tmp/result.json)
          FILE_PATH=$(jq -r '.file_path' /tmp/result.json)

          if [ "$VALID" != "true" ]; then
            README_URL="https://github.com/$GITHUB_REPOSITORY/blob/main/registry/README.md"
            gh issue comment "$ISSUE_NUMBER" --body "$(printf 'This registration needs a fix before it can proceed:\n\n%s\n\nUpdate the issue description and it will be re-checked. See [registry/README.md](%s) for the requirements.' "$CHECKLIST" "$README_URL")"
            exit 0
          fi

          # -B + --force-with-lease so a stale branch left by an abandoned
          # previous attempt at the same repo doesn't hard-fail this run.
          BRANCH="register/$(echo "$REPO" | tr '/' '-' | tr '[:upper:]' '[:lower:]')"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "$BRANCH"
          git add "$FILE_PATH"
          git commit -m "Register $REPO"
          git push --force-with-lease origin "$BRANCH"

          # Reuse an already-open PR from a prior attempt at this same repo
          # instead of erroring out -- gh pr create fails if one exists.
          PR_BODY="$(printf 'Opened from #%s.\n\n%s' "$ISSUE_NUMBER" "$CHECKLIST")"
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            PR_NUMBER="$EXISTING_PR"
            gh pr edit "$PR_NUMBER" --body "$PR_BODY"
          else
            PR_URL=$(gh pr create --title "Register $REPO" --base main --head "$BRANCH" --body "$PR_BODY")
            PR_NUMBER=$(basename "$PR_URL")
          fi
          PR_URL="https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER"

          if [ "$AUTO_MERGE" = "true" ]; then
            if gh pr merge "$PR_NUMBER" --squash --delete-branch; then
              gh issue comment "$ISSUE_NUMBER" --body "$(printf 'Registered! Merged as %s.\n\n%s' "$PR_URL" "$CHECKLIST")"
              gh issue close "$ISSUE_NUMBER"
            else
              echo "::warning::Auto-merge eligible but merge failed (branch protection?) -- leaving $PR_URL open for a maintainer."
              gh issue comment "$ISSUE_NUMBER" --body "$(printf 'Opened %s. Every check passed but it could not be auto-merged (repository settings) -- a maintainer will merge it.\n\n%s' "$PR_URL" "$CHECKLIST")"
            fi
          else
            gh issue comment "$ISSUE_NUMBER" --body "$(printf 'Opened %s. It is not yet eligible to auto-merge, so a maintainer will review and merge it.\n\n%s' "$PR_URL" "$CHECKLIST")"
          fi
